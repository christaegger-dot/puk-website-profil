<svg class="ig-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1045" width="820" height="1045" role="img" aria-labelledby="a2t a2d"><style>:root{--bg-primary:#fff;--accent-label:#3155dc;--fg-primary:#222;--accent-primary:#3155dc;--fg-secondary:#505050;--ig-rose:#d8e0ff;--accent-primary-h:#2444be;--bg-sage-wash:#ebefff;--ig-sage-deep:#2444be}</style><title id="a2t">Mögliche Begleiterkrankungen bei Borderline</title><desc id="a2d">Schematische Liste von sechs möglichen zusätzlichen Diagnosen: Depression, Angststörungen, posttraumatische Belastungsstörung, Substanzgebrauchsstörung, Essstörungen und ADHS. Alle Einträge sind gleich gross und unverbunden dargestellt. In Studien hatten viele, aber nicht alle Menschen mit Borderline weitere Diagnosen. Die Grafik zeigt weder Ursache noch individuelle Wahrscheinlichkeit oder Rangfolge. Angehörige müssen Beschwerden nicht selbst diagnostisch zuordnen.</desc><rect width="820" height="1045" fill="var(--bg-primary)"></rect><text x="64" y="70" font-size="13.5" fill="var(--accent-label)" font-weight="600" text-anchor="start" letter-spacing="2.2">KONSTELLATION · BEGLEITERKRANKUNGEN</text><text x="64" y="116" font-size="34" fill="var(--fg-primary)" font-weight="700" text-anchor="start">Mögliche Begleiterkrankungen</text><rect x="64" y="132" width="58" height="3" fill="var(--accent-primary)"></rect><text x="64" y="162" font-size="16.5" fill="var(--fg-secondary)" text-anchor="start">Viele, aber nicht alle Menschen mit Borderline haben weitere Diagnosen</text><text x="64" y="205" font-size="12.5" fill="var(--fg-secondary)" font-style="italic" text-anchor="start">Sechs mögliche Diagnosen · keine Rangfolge · keine individuelle Prognose</text><g id="diagnosis-list" data-layout="equal-list" aria-hidden="true"><g><circle cx="195" cy="330" r="68" fill="var(--ig-rose)" stroke="var(--accent-primary)" stroke-opacity="0.35" stroke-width="1"></circle><text x="195" y="335" font-size="15" fill="var(--accent-primary-h)" font-weight="600" text-anchor="middle">Depression</text></g><g><circle cx="410" cy="330" r="68" fill="var(--ig-rose)" stroke="var(--accent-primary)" stroke-opacity="0.35" stroke-width="1"></circle><text x="410" y="325" font-size="15" fill="var(--accent-primary-h)" font-weight="600" text-anchor="middle">Angst-</text><text x="410" y="345" font-size="15" fill="var(--accent-primary-h)" font-weight="600" text-anchor="middle">störungen</text></g><g><circle cx="625" cy="330" r="68" fill="var(--ig-rose)" stroke="var(--accent-primary)" stroke-opacity="0.35" stroke-width="1"></circle><text x="625" y="335" font-size="15" fill="var(--accent-primary-h)" font-weight="600" text-anchor="middle">PTBS</text></g><g><circle cx="195" cy="535" r="68" fill="var(--ig-rose)" stroke="var(--accent-primary)" stroke-opacity="0.35" stroke-width="1"></circle><text x="195" y="530" font-size="15" fill="var(--accent-primary-h)" font-weight="600" text-anchor="middle">Substanz-</text><text x="195" y="550" font-size="12.5" fill="var(--accent-primary-h)" font-weight="600" text-anchor="middle">gebrauchsstörung</text></g><g><circle cx="410" cy="535" r="68" fill="var(--ig-rose)" stroke="var(--accent-primary)" stroke-opacity="0.35" stroke-width="1"></circle><text x="410" y="540" font-size="15" fill="var(--accent-primary-h)" font-weight="600" text-anchor="middle">Essstörungen</text></g><g><circle cx="625" cy="535" r="68" fill="var(--ig-rose)" stroke="var(--accent-primary)" stroke-opacity="0.35" stroke-width="1"></circle><text x="625" y="540" font-size="15" fill="var(--accent-primary-h)" font-weight="600" text-anchor="middle">ADHS</text></g></g><text x="64" y="654" font-size="12.5" fill="var(--fg-secondary)" font-style="italic" text-anchor="start">Die Einträge sind schematisch, gleich gross und ohne Verbindungen dargestellt.</text><text x="64" y="674" font-size="12.5" fill="var(--fg-secondary)" font-style="italic" text-anchor="start">Sie zeigen keine Ursache, individuelle Wahrscheinlichkeit oder Rangfolge.</text><rect x="64" y="710" width="3" height="98" fill="var(--accent-primary)"></rect><text x="86" y="734" font-size="17.5" fill="var(--fg-primary)" font-style="italic" text-anchor="start">Mehrere Diagnosen heissen mehr Komplexität – nicht mehr Schuld.</text><text x="86" y="764" font-size="17.5" fill="var(--fg-primary)" font-style="italic" text-anchor="start">Welche Unterstützung passt, wird individuell fachlich geklärt.</text><text x="86" y="794" font-size="17.5" fill="var(--fg-primary)" font-style="italic" text-anchor="start">Sie müssen nicht sortieren, was was ist.</text><rect x="64" y="836" width="692" height="95" rx="10" fill="var(--bg-sage-wash)"></rect><text x="84" y="860" font-size="11.5" fill="var(--ig-sage-deep)" font-weight="700" text-anchor="start" letter-spacing="2">HINWEIS</text><text x="84" y="883" font-size="14" fill="var(--fg-primary)" text-anchor="start">Bei deutlicher Verschlechterung, Hoffnungslosigkeit oder Sorge um die Sicherheit</text><text x="84" y="903" font-size="14" fill="var(--fg-primary)" text-anchor="start">braucht es eine professionelle Einschätzung – unabhängig davon, welcher Diagnose</text><text x="84" y="923" font-size="14" fill="var(--fg-primary)" text-anchor="start">Beschwerden zugeordnet werden.</text><line x1="64" y1="961" x2="756" y2="961" stroke="var(--fg-primary)" stroke-opacity="0.14" stroke-width="1"></line><text x="64" y="985" font-size="12.5" fill="var(--fg-secondary)" font-weight="600" text-anchor="start">Fachstelle Angehörigenarbeit · Psychiatrische Universitätsklinik Zürich</text><text x="64" y="1005" font-size="11.5" fill="var(--fg-secondary)" font-style="italic" text-anchor="start" opacity="0.9">Quellen: Shah &amp; Zanarini (2018) · Weiner, Perroud &amp; Weibel (2019)</text><text x="64" y="1021" font-size="11.5" fill="var(--fg-secondary)" font-style="italic" text-anchor="start" opacity="0.9">Vollbibliographie: borderline-angehoerige.netlify.app/quellen</text></svg>